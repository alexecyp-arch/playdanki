<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Solve as many arithmetic equations as you can in 60 seconds."><title>ARITHMETIC</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#071e48;color:#fff;font:700 14px/1.4 Arial,Helvetica,sans-serif}main{position:relative;min-height:100svh;padding:110px 24px 120px;display:flex;flex-direction:column;align-items:center;justify-content:center}button,input{font:inherit;color:inherit}button{background:#071e48;border:2px solid #45618e;border-radius:0;cursor:pointer;padding:10px 20px}button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid #fff;outline-offset:4px}[hidden]{display:none!important}#round-status{font-size:16px;font-variant-numeric:tabular-nums;margin:0 0 24px}#exercise{display:flex;align-items:center;justify-content:center;gap:16px;max-width:100%;font-size:56px}#problem{white-space:nowrap}#answer{width:5ch;min-width:0;border:0;border-bottom:2px solid #a3b4d1;border-radius:0;background:transparent;padding:0;font-size:inherit;font-weight:900;outline:0}#answer:focus{border-bottom-color:#fff}#start{margin:20px 0}#result{font-size:32px;margin:12px 0;text-align:center}#bottom{position:absolute;bottom:18px;right:20px;text-align:right}#history{position:relative}#total{list-style:none;cursor:pointer;font-size:12px}#total::-webkit-details-marker{display:none}.daily-scores{position:absolute;right:0;bottom:calc(100% + 12px);width:min(320px,calc(100vw - 32px));max-height:min(420px,60svh);overflow:auto;background:#071e48;border:2px solid #45618e;padding:14px;text-align:left;box-shadow:inset 0 2px #ffffff26,0 4px #101113,0 8px 18px #0005}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:8px 4px;border-bottom:1px solid #ffffff20}th:last-child,td:last-child{text-align:right}#warning{font-size:11px;text-align:center;max-width:320px}summary{touch-action:manipulation}
</style></head><body><main>
<output id="round-status" aria-label="Time and score">60 SECONDS · 0 CORRECT</output>
<div id="exercise" hidden><label id="problem" for="answer"></label><input id="answer" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" aria-label="Answer" disabled></div>
<output id="result" role="status" hidden></output><button id="start" type="button">START</button>
<p id="warning" role="alert" hidden></p>
<section id="bottom" aria-label="Daily best scores"><details id="history"><summary id="total">TODAY'S BEST: 0</summary><div class="daily-scores"><table><thead><tr><th>DAY</th><th>BEST SCORE</th></tr></thead><tbody id="rows"></tbody></table></div></details></section>
</main><script>
(()=>{'use strict';
const $=id=>document.getElementById(id),prefix='arithmetic60:v1:best:',ownerKey='danki:owner:v1',tab=crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random(),memory=new Map();
let running=false,score=0,expected=0,deadline=0,wallDeadline=0,runDay='',runOwner=null,speechId=0,storage=true;
const day=(at=new Date())=>at.getFullYear()+'-'+String(at.getMonth()+1).padStart(2,'0')+'-'+String(at.getDate()).padStart(2,'0');
const rand=(min,max)=>min+Math.floor(Math.random()*(max-min+1));
function warn(){storage=false;$('warning').hidden=false;$('warning').textContent='PROGRESS COULD NOT BE SAVED.'}
function owner(){try{return localStorage.getItem(ownerKey)}catch{return null}}
function get(k){if(storage)try{return localStorage.getItem(k)}catch{warn()}return memory.get(k)??null}
function put(k,v){memory.set(k,String(v));if(storage)try{localStorage.setItem(k,String(v));try{parent.document.dispatchEvent(new Event('danki-progress'))}catch{}}catch{warn()}}
function records(){const keys=new Set(memory.keys());if(storage)try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k?.startsWith(prefix))keys.add(k)}}catch{warn()}const days={};for(const key of keys){if(!key.startsWith(prefix))continue;const raw=get(key);if(raw===null)continue;const date=key.slice(prefix.length,prefix.length+10),n=Number(raw);if(/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(date)&&Number.isSafeInteger(n)&&n>=0&&n<=100000)days[date]=Math.max(days[date]??0,n)}return days}
function refresh(){const days=records();$('total').textContent="TODAY'S BEST: "+(days[day()]??0);$('rows').replaceChildren(...Object.keys(days).sort().reverse().map(key=>{const tr=document.createElement('tr'),date=document.createElement('td'),best=document.createElement('td');date.textContent=key.split('-').reverse().join('/');best.textContent=days[key];tr.append(date,best);return tr}))}
function next(){const op=rand(0,3),a=rand(2,op<2?100:12),b=rand(2,100);let text;if(op===0){text=a+' + '+b;expected=a+b}else if(op===1){text=(a+b)+' − '+a;expected=b}else if(op===2){text=a+' × '+b;expected=a*b}else{text=(a*b)+' ÷ '+a;expected=b}$('problem').textContent=text+' =';$('answer').value=''}
function remaining(){return Math.min(deadline-performance.now(),wallDeadline-Date.now())}
function finish(save=true){if(!running)return;running=false;$('answer').disabled=true;$('exercise').hidden=true;$('round-status').textContent='0 SECONDS · '+score+' CORRECT';$('result').textContent=score+' CORRECT';$('result').hidden=false;$('start').textContent='AGAIN';$('start').hidden=false;if(save&&owner()===runOwner){const key=prefix+runDay+':'+tab;put(key,Math.max(Number(get(key))||0,score))}refresh()}
function tick(){if(running){if(owner()!==runOwner){finish(false);return}const time=remaining();if(time<=0){finish();return}$('round-status').textContent=Math.ceil(time/1000)+(Math.ceil(time/1000)===1?' SECOND · ':' SECONDS · ')+score+' CORRECT'}}
function start(){if(running)return;score=0;runDay=day();runOwner=owner();deadline=performance.now()+60000;wallDeadline=Date.now()+60000;running=true;$('history').open=false;$('result').hidden=true;$('start').hidden=true;$('exercise').hidden=false;$('answer').disabled=false;next();tick();$('answer').focus({preventScroll:true})}
function blocked(){try{return parent!==window&&(!!parent.document.querySelector('.games-menu[open]')||!!parent.document.querySelector('body.notes-open,body.atlas-open,body.weight-open,body.timebox-open')||parent.document.getElementById('arithmetic-frame')?.hidden)}catch{return false}}
function checkAnswer(e){if(e?.isComposing||document.hidden||blocked()||!running)return;if(owner()!==runOwner){finish(false);return}if(remaining()<=0){finish();return}if(!/^[0-9]+$/.test($('answer').value.trim())||Number($('answer').value)!==expected)return;score++;window.DankiAnswerVoice?.('arithmetic',++speechId,String(expected),true);next();tick()}
$('start').addEventListener('click',start);$('answer').addEventListener('input',checkAnswer);$('answer').addEventListener('compositionend',checkAnswer);
document.addEventListener('keydown',e=>{if(e.isComposing||e.ctrlKey||e.altKey||e.metaKey||!['Enter',' '].includes(e.key)||blocked()||e.target.closest?.('summary,a,button'))return;e.preventDefault();if(!running){if(!e.repeat)start()}else $('answer').focus({preventScroll:true})});
addEventListener('storage',e=>{if(e.key===null||e.key===ownerKey||e.key?.startsWith(prefix)){if(running&&owner()!==runOwner)finish(false);refresh()}});
try{if(parent!==window)parent.addEventListener('danki-auth-clearing',()=>finish(false))}catch{}
document.addEventListener('visibilitychange',()=>{tick();if(!document.hidden)refresh()});
setInterval(tick,100);setInterval(refresh,30000);refresh();
})();
</script></body></html>
