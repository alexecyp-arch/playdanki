<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071e48"><title>LOGS</title><link rel="stylesheet" href="style.css"></head><body><header><h1>LOGS</h1><nav class="page-links"><a class="danki-return" href="/">DANKI</a><a class="temponote-link" href="/temponotes/" target="_top">TEMPONOTE</a></nav></header><main><div id="auth-gate" hidden><button id="sign-in" type="button">SIGN IN</button></div><section id="sleep-panel" aria-label="DAILY SLEEP HOURS" hidden><h2 class="log-heading">SLEEP LOG</h2><svg id="sleep-chart" role="img" aria-label="DAILY SLEEP HOURS OVER TIME"></svg><output id="sleep-average">7-DAY AVERAGE: —</output><div class="sleep-controls"><form id="sleep-form"><div class="sleep-date-controls"><button id="sleep-day-prev" type="button" aria-label="PREVIOUS DAY">‹</button><input id="sleep-date" type="date" aria-label="SLEEP HOURS DATE" required><button id="sleep-day-next" type="button" aria-label="NEXT DAY">›</button></div><button id="sleep-add" type="button" disabled>+1 HOUR</button><button id="sleep-remove" type="button" disabled>−1 HOUR</button><button id="sleep-add-minutes" type="button" disabled>+10 MINUTES</button><button id="sleep-remove-minutes" type="button" disabled>−10 MINUTES</button></form><output id="sleep-status" aria-live="polite"></output></div></section><section id="weight-panel"><hr class="log-divider"><h2 class="log-heading">WEIGHT LOG</h2><svg id="chart" role="group" aria-label="WEIGHT OVER TIME"></svg><form id="weight-form" hidden><input id="weight" aria-label="WEIGHT" placeholder="WEIGHT" type="number" inputmode="decimal" min="0.01" max="1000" step="any" required autocomplete="off"><button id="kg" type="button" aria-pressed="true">KG</button><button id="lb" type="button" aria-pressed="false">LB</button><button id="add" type="submit" disabled>ADD</button><span id="selected-entry" hidden><output id="selected-value"></output><butt e="application/json">AUTH_CONFIG</script><script type="module" src="bootstrap.js"></script></body></html>
