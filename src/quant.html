<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071e48"><title>QUANT</title><link rel="stylesheet" href="quant.css"><link rel="stylesheet" href="cursor.css"><script defer src="card-navigation.js"></script><script defer src="quant-course.js"></script><script defer src="quant.js"></script></head>
