name: Publish PlayDanki
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Prepare PDF reader
        run: |
          mkdir -p src/book-reader/vendor
          archive=$(npm pack pdfjs-dist@6.3.289 --ignore-scripts --silent)
          tar -xzf "$archive" --strip-components=2 -C src/book-reader/vendor package/build/pdf.min.mjs package/build/pdf.worker.min.mjs
      - name: Build static website
        run: node scripts/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
